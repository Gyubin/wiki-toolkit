[project]
name = "wiki-agents"
version = "0.1.0"
description = "Personal AI wiki + learning agent that writes a separate Markdown vault"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "markdownify>=0.11",
    "rank-bm25>=0.2.2",
    "fastembed>=0.3",
]

[project.scripts]
wiki = "wiki_agents.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "pre-commit>=3.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is fine in tests; assert is also used as runtime guards in core gates.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]  # tests use subprocess, tmp paths, asserts freely

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# dist name is `wiki-agents` but the import package stays `wiki_agents` — tell hatchling.
[tool.hatch.build.targets.wheel]
packages = ["wiki_agents"]
