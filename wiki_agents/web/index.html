<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Personal AI Wiki</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; }
    nav button { padding: .6rem 1rem; border: 0; background: #eee; cursor: pointer; }
    nav button.active { background: #ddd; font-weight: 600; }
    main { padding: 1rem; }
    .panel { display: none; } .panel.active { display: block; }
    #log { white-space: pre-wrap; border: 1px solid #ccc; padding: .5rem; min-height: 8rem; }
    textarea { width: 100%; height: 6rem; }
    .row { border-bottom: 1px solid #eee; padding: .4rem 0; }
    button.act { margin-left: .5rem; }
  </style>
</head>
<body>
  <nav>
    <button data-tab="chat" class="active">Chat</button>
    <button data-tab="capture">Capture</button>
    <button data-tab="wrap">Wrap</button>
    <button data-tab="verify">Verify</button>
    <button data-tab="review">Review</button>
    <button data-tab="lint">Lint</button>
    <button data-tab="search">Search</button>
  </nav>
  <main>
    <section id="chat" class="panel active">
      <div id="log"></div>
      <input id="prompt" style="width:72%" placeholder="이거 인제스트해줘 / X에 대해 답해줘" />
      <button onclick="send()">Send</button>
      <button onclick="resetChat()">새 대화</button>
    </section>
    <section id="capture" class="panel">
      <textarea id="capContent" placeholder="대화/텍스트 붙여넣기"></textarea>
      <input id="capUrl" style="width:60%" placeholder="또는 URL" />
      <button onclick="capture()">Capture → Inbox</button>
      <div id="capMsg"></div>
    </section>
    <section id="wrap" class="panel">
      <input id="wrapRepo" style="width:60%" placeholder="repo 절대경로 (예: /Users/me/work/myrepo)" />
      <input id="wrapBase" style="width:18%" placeholder="base (예: HEAD~1)" />
      <input id="wrapHead" style="width:18%" placeholder="head (기본 HEAD)" />
      <textarea id="wrapTranscript" placeholder="(선택) 코딩 에이전트 transcript"></textarea>
      <button onclick="wrapRun()">Wrap</button>
      <div id="wrapLog" style="white-space:pre-wrap;border:1px solid #ccc;padding:.5rem;min-height:6rem"></div>
    </section>
    <section id="verify" class="panel">
      <button onclick="loadPending()">새로고침</button>
      <div id="pending"></div>
    </section>
    <section id="review" class="panel">
      <button onclick="loadDue()">새로고침</button>
      <div id="due"></div>
    </section>
    <section id="lint" class="panel">
      <button onclick="loadLint()">결정론적 점검</button>
      <button onclick="lintContradictions()">모순 검사 (LLM)</button>
      <div id="lintFindings"></div>
      <div id="lintContra" style="white-space:pre-wrap;border:1px solid #ccc;padding:.5rem;margin-top:.5rem"></div>
    </section>
    <section id="search" class="panel">
      <input id="searchQ" style="width:70%" placeholder="의미 기반 검색어" />
      <button onclick="searchRun()">검색</button>
      <div id="searchResults"></div>
    </section>
  </main>
  <script>
    document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
      document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.tab).classList.add('active');
    });
    // vault 내용(클리핑한 웹 유래)은 신뢰 불가: 항상 이스케이프해서 렌더링한다
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    // SSE 공용 파서: 청크 경계가 멀티바이트 문자나 프레임 중간에 걸려도 안전하게,
    // "\n\n" 단위로 잘라 JSON 페이로드를 onChunk로 넘긴다
    async function readStream(res, onChunk) {
      if (!res.ok) { onChunk({error: 'HTTP ' + res.status}); return; }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let i;
        while ((i = buf.indexOf('\n\n')) !== -1) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!ev.startsWith('data: ')) continue;
          const payload = ev.slice(6);
          if (payload === '[DONE]') return;
          onChunk(JSON.parse(payload));
        }
      }
    }
    function appendChunk(el) {
      return chunk => {
        if (typeof chunk === 'string') el.textContent += chunk;
        else if (chunk && chunk.error) el.textContent += '\n[오류] ' + chunk.error + '\n';
      };
    }
    async function send() {
      const prompt = document.getElementById('prompt').value;
      const log = document.getElementById('log');
      log.textContent += '\n> ' + prompt + '\n';
      const res = await fetch('/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({prompt})});
      await readStream(res, appendChunk(log));
    }
    async function resetChat() {
      await fetch('/chat/reset', {method: 'POST'});
      document.getElementById('log').textContent = '(새 대화)\n';
    }
    async function wrapRun() {
      const body = {
        repo: document.getElementById('wrapRepo').value,
        base: document.getElementById('wrapBase').value || 'HEAD~1',
        head: document.getElementById('wrapHead').value || 'HEAD',
        transcript: document.getElementById('wrapTranscript').value || null,
      };
      const log = document.getElementById('wrapLog');
      log.textContent = 'wrapping...\n';
      const res = await fetch('/wrap', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
      await readStream(res, appendChunk(log));
    }
    async function loadLint() {
      const rows = await (await fetch('/lint')).json();
      document.getElementById('lintFindings').innerHTML = rows.map(f =>
        `<div class="row">[${esc(f.severity)}] ${esc(f.check)} - ${esc(f.ref)}: ${esc(f.message)}</div>`).join('') || '깨끗함';
    }
    async function lintContradictions() {
      const out = document.getElementById('lintContra');
      out.textContent = 'checking...\n';
      const res = await fetch('/lint/contradictions', {method: 'POST'});
      await readStream(res, appendChunk(out));
    }
    async function searchRun() {
      const q = document.getElementById('searchQ').value;
      const rows = await (await fetch('/search?q=' + encodeURIComponent(q))).json();
      document.getElementById('searchResults').innerHTML = rows.map(r =>
        `<div class="row"><b>${esc(r.title)}</b> <small>[${esc(r.ref)}] ${esc(r.score)}</small><br>${esc(r.snippet)}</div>`
      ).join('') || '결과 없음';
    }
    async function capture() {
      const content = document.getElementById('capContent').value;
      const url = document.getElementById('capUrl').value || null;
      const r = await fetch('/capture', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({origin: 'manual', content, url})});
      document.getElementById('capMsg').textContent = JSON.stringify(await r.json());
    }
    async function loadPending() {
      const rows = await (await fetch('/claims/pending')).json();
      document.getElementById('pending').innerHTML = rows.map(r =>
        `<div class="row">${esc(r.id)}: ${esc(r.claim)}
         <button class="act" onclick="approve('${esc(r.id)}')">승인</button>
         <button class="act" onclick="reject('${esc(r.id)}')">거부</button></div>`).join('') || '없음';
    }
    async function approve(id) { await fetch(`/claims/${encodeURIComponent(id)}/approve`, {method: 'POST'}); loadPending(); }
    async function reject(id) { await fetch(`/claims/${encodeURIComponent(id)}/reject`, {method: 'POST'}); loadPending(); }
    async function loadDue() {
      const rows = await (await fetch('/reviews/due')).json();
      document.getElementById('due').innerHTML = rows.map(r =>
        `<div class="row">${esc(r.id)}: ${esc(r.topic)} (${esc(r.level)})
         <button class="act" onclick="rec('${esc(r.id)}',true)">통과</button>
         <button class="act" onclick="rec('${esc(r.id)}',false)">실패</button></div>`).join('') || '없음';
    }
    async function rec(id, passed) { await fetch(`/reviews/${encodeURIComponent(id)}/record?passed=${passed}`, {method: 'POST'}); loadDue(); }
  </script>
</body>
</html>
